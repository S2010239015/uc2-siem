---
# Provisioniert ausschliesslich die neutrale Umgebung. Kein SIEM.
# Das SIEM wird nach der Allokation manuell installiert, ueber die
# unter /opt/siem/ abgelegten Skripte.

- name: SIEM-Host vorbereiten (nur Install-Skripte ablegen, nichts starten)
  hosts: siem
  become: true
  roles:
    - siem-host

- name: Verwundbares Zielsystem aufsetzen (Web, DB, Schwaechen)
  hosts: victim
  become: true
  roles:
    - victim-host

- name: Angreifer-Host aufsetzen (Werkzeuge, Rauschen, Szenarien)
  hosts: attacker
  become: true
  roles:
    - attacker-host
