---
# Der siem-Host bleibt neutral. Es wird nichts installiert und nichts
# gestartet. Es werden nur die Install-Skripte fuer die SIEMs abgelegt,
# damit sie im Betrieb per Hand ausgefuehrt werden koennen.

- name: Verzeichnis fuer SIEM-Install-Skripte anlegen
  file:
    path: /opt/siem
    state: directory
    mode: "0755"

- name: Wazuh-Manager-Install-Skript ablegen (inaktiv)
  copy:
    src: install-wazuh-manager.sh
    dest: /opt/siem/install-wazuh-manager.sh
    mode: "0755"
