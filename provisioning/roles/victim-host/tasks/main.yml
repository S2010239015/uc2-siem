---
# Das victim ist die ueberwachte Maschine: Web, DB, normale User und
# die geplanten Schwaechen fuer die drei Szenarien. Es wird bewusst
# KEIN SIEM-Agent installiert - der gehoert zum Pruefobjekt und wird
# im Betrieb ueber /opt/siem/install-wazuh-agent.sh nachgezogen.

- name: Paketquellen aktualisieren
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Pakete fuer Web, DB und Monitoring-Grundlage
  apt:
    name:
      - openssh-server
      - auditd
      - sudo
      - curl
      - apache2
      - php
      - libapache2-mod-php
      - php-mysql
      - mysql-server
    state: present

# --- Angriffsflaeche Szenario 1: schwacher SSH-Zugang ----------------
- name: SSH-Passwort-Login aktivieren
  copy:
    dest: /etc/ssh/sshd_config.d/50-lab.conf
    content: |
      PasswordAuthentication yes
      PermitRootLogin no
    mode: "0644"
  notify: restart ssh

- name: Schwaches Benutzerkonto anlegen (Szenario 1/2)
  user:
    name: "{{ weak_user }}"
    password: "{{ weak_pass | password_hash('sha512') }}"
    groups: sudo
    shell: /bin/bash
    append: true

- name: sudo ohne Passwort fuer den schwachen User (Fehlkonfiguration, Event 4)
  copy:
    dest: /etc/sudoers.d/50-sysops
    content: "{{ weak_user }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: Anwendungs-Benutzer fuer den Webdienst
  user:
    name: webapp
    shell: /bin/bash
    create_home: true

# --- Web + DB (Ziel fuer Szenario 3) ---------------------------------
- name: Webanwendung ablegen
  copy:
    src: "{{ item }}"
    dest: "/var/www/html/{{ item }}"
    mode: "0644"
  loop:
    - index.php
    - db.php

- name: MySQL starten
  service:
    name: mysql
    state: started
    enabled: true

- name: Datenbank, Tabelle und Web-Benutzer anlegen
  shell: |
    mysql -e "CREATE DATABASE IF NOT EXISTS {{ db_name }};"
    mysql {{ db_name }} -e "CREATE TABLE IF NOT EXISTS kunden (id INT PRIMARY KEY, name VARCHAR(60), iban VARCHAR(34));"
    mysql {{ db_name }} -e "INSERT IGNORE INTO kunden VALUES (1,'Muster GmbH','AT611904300234573201'),(2,'Beispiel AG','AT022050302101023600'),(3,'Test KG','AT483200000012345864');"
    mysql -e "CREATE USER IF NOT EXISTS '{{ db_user }}'@'localhost' IDENTIFIED BY '{{ db_pass }}';"
    mysql -e "GRANT SELECT, LOCK TABLES ON {{ db_name }}.* TO '{{ db_user }}'@'localhost'; GRANT PROCESS ON *.* TO '{{ db_user }}'@'localhost';"
    mysql -e "FLUSH PRIVILEGES;"
  args:
    executable: /bin/bash

# --- Credential-Spur fuer Szenario 3 (Event 8) -----------------------
- name: DB-Zugangsdaten in der bash_history von webapp platzieren
  copy:
    dest: /home/webapp/.bash_history
    content: |
      cd /var/www/html
      mysql -u {{ db_user }} -p{{ db_pass }} {{ db_name }} -e "select count(*) from kunden"
      exit
    owner: webapp
    group: webapp
    mode: "0600"

# --- Schwaeche fuer Szenario 2 (Event 6): SUID-Bits ------------------
- name: SUID-Bits auf find und vim setzen
  file:
    path: "{{ item }}"
    mode: "u+s"
  loop:
    - /usr/bin/find
    - /usr/bin/vim.basic

# --- Auditd-Regeln fuer Szenario 2 (Event 7) -------------------------
- name: Auditd-Regeln fuer sensible Dateien
  copy:
    dest: /etc/audit/rules.d/lab.rules
    content: |
      -w /etc/shadow -p r -k shadow_read
      -w /home -p r -k home_read
    mode: "0640"
  notify: audit rules laden

# --- Betriebs-Skript fuer den Wazuh-Agent ablegen (inaktiv) ----------
- name: Verzeichnis fuer SIEM-Install-Skripte anlegen
  file:
    path: /opt/siem
    state: directory
    mode: "0755"

- name: Wazuh-Agent-Install-Skript ablegen (inaktiv)
  copy:
    src: install-wazuh-agent.sh
    dest: /opt/siem/install-wazuh-agent.sh
    mode: "0755"
