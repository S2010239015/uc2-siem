---
# Der attacker fuehrt die drei Szenarien gegen victim aus und erzeugt
# das Hintergrund-Rauschen, damit das SIEM in Szenario 2 und 3 nicht
# jede Aktivitaet als anomal wertet.

- name: Paketquellen aktualisieren
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Angriffswerkzeuge und Clients installieren
  apt:
    name:
      - nmap
      - hydra
      - sshpass
      - netcat-openbsd
      - default-mysql-client
    state: present

- name: Szenario-Verzeichnis anlegen
  file:
    path: /opt/scenarios
    state: directory
    mode: "0755"

- name: Szenario-Skripte und Wortliste ablegen
  copy:
    src: "scenarios/{{ item }}"
    dest: "/opt/scenarios/{{ item }}"
    mode: "0755"
  loop:
    - scenario1_baseline.sh
    - scenario2_lotl.sh
    - scenario3_lateral.sh
    - passwords.txt

- name: Traffic-Rausch-Generator ablegen
  copy:
    src: traffic-noise.sh
    dest: /opt/scenarios/traffic-noise.sh
    mode: "0755"

- name: systemd-Unit fuer das Rauschen ablegen
  copy:
    src: traffic-noise.service
    dest: /etc/systemd/system/traffic-noise.service
    mode: "0644"

- name: Traffic-Rauschen aktivieren und starten
  systemd:
    name: traffic-noise
    state: started
    enabled: true
    daemon_reload: true
